[www]
user = www-data
group = www-data

listen = 0.0.0.0:8000
listen.backlog = 511

; Required so php-fpm (TCP) and the CLI SAPI agree on the port
clear_env = no

pm = dynamic
pm.max_children = 24
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000

; Catch worker crashes instead of letting the request hang
request_terminate_timeout = 120s
catch_workers_output = yes
decorate_workers_output = no
